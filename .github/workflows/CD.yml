# 将静态内容部署到 GitHub Pages 的简易工作流程
name: Deploy static content to Pages

on:
  # 仅在推送到默认分支时运行。
  push:
    branches: ["main"]

  # 这个选项可以使你手动在 Action tab 页面触发工作流
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages。
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发的部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 单次部署的工作描述
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 设置 pnpm（版本与根 package.json packageManager 一致）
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      # 设置 Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 安装依赖（postinstall 会自动执行 stub 预构建）
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 全量 monorepo 构建（与根目录 pnpm run build 一致）
      - name: Build project
        run: pnpm run build
        env:
          NODE_ENV: production

      # 检查构建产物目录
      - name: List build directory
        run: ls -R ${{ github.workspace }}/sample/dist

      # 设置 Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 上传构建产物（VITE_PUBLIC_PATH=/，部署到 Pages 根路径）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/sample/dist

      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
