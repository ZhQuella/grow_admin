<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      .app-loading__logo {
        box-sizing: border-box;
        width: 52px;
        height: 52px;
        overflow: hidden;
      }

      .app-loading__logo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform-origin: center center;
      }
    </style>
    <link rel="stylesheet" href="/app-loading.css" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grow Admin</title>
    <script>
      ;(function () {
        try {
          var html = document.documentElement
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches

          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i)
            if (!key || key.indexOf('APP_CONFIG') === -1) continue

            var raw = localStorage.getItem(key)
            if (!raw) continue

            var data = JSON.parse(raw)
            var mode = data.themeMode

            if (mode === 'dark' || (mode !== 'light' && prefersDark)) {
              html.classList.add('dark')
            }
            return
          }

          if (prefersDark) html.classList.add('dark')
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="app-loading" aria-live="polite" aria-busy="true" aria-label="Loading">
      <div class="app-loading__logo">
        <img src="/logo.png" alt="Grow Admin" width="36" height="36" />
      </div>
      <p class="app-loading__title">Grow Admin</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
